name: Validar Integridad y Calidad del Repositorio

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validar Estructura y Lecciones en JS
        run: |
          python -c "
          import os, re
          with open('assets/js/app.js', 'r', encoding='utf-8') as f:
              content = f.read()
          paths = re.findall(r\"path:\s*'([^']+)'\", content)
          missing = [p for p in paths if not os.path.exists(p)]
          if missing:
              print('❌ Archivos de lección faltantes:', missing)
              exit(1)
          print(f'✅ Se verificaron {len(paths)} lecciones correctamente en disco.')
          "
